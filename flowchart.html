  <p class="note">
    <b>读法：</b>左侧绿色为起点，沿蓝色主线依次经过 ①库存核查 → ②科室领用 → ③使用扫码 → ④退库 → ⑤补货 → ⑥验收。
    橙色菱形为判断点：条件不满足（<b>否</b>，红虚线）即转入右侧对应 REQ 异常处理；人工确认/修复后（<b>灰虚线</b>）返回原步骤重试。
    REQ-4 / REQ-5 为贯穿全程机制（紫虚线）。所有 P0 高风险环节均设有具名人工接收人与否决权，体现「不可逆动作前确定性校验」原则。
  </p>
